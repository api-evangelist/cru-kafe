name: CRU Kafe
description: >-
  CRU Kafe is a London-founded organic coffee brand selling Fairtrade, ethically sourced
  coffee - including award-winning Nespresso-compatible pods from 33p per pod, plus ground
  coffee and beans - direct to consumers through its Shopify storefront at crukafe.com.
  Backed by Seedcamp, the company was added to the API Evangelist network as a portfolio
  lead. CRU Kafe publishes no first-party developer API; its machine-readable surface is
  the Shopify / Universal Commerce Protocol (UCP) agent-commerce layer served on its own
  domain: a hosted UCP MCP endpoint for agent-driven catalog search and buyer-approved
  checkout, an llms.txt / agents.md for AI shopping assistants, and Shopify Customer Account
  OAuth 2.0 / OpenID Connect identity.
